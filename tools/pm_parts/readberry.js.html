<script>
(function(){
  var btn=document.querySelector('[data-rb-reel]'), m=document.querySelector('.rb-modal'); if(!btn||!m) return;
  var v=m.querySelector('video'), last=null;
  function open(){ last=document.activeElement; m.hidden=false; requestAnimationFrame(function(){ m.classList.add('is-open'); }); v.preload='auto'; var p=v.play(); if(p&&p.catch)p.catch(function(){}); m.querySelector('.rb-modal__close').focus(); document.addEventListener('keydown',key); }
  function close(){ v.pause(); m.classList.remove('is-open'); setTimeout(function(){ m.hidden=true; },250); document.removeEventListener('keydown',key); if(last&&last.focus) last.focus(); }
  function key(e){ if(e.key==='Escape') close(); }
  btn.addEventListener('click',open);
  m.addEventListener('click',function(e){ if(e.target===m||e.target.closest('.rb-modal__close')) close(); });
})();
</script>
<script>
(function(){
  var vids=[].slice.call(document.querySelectorAll('.rb-cr__v')); if(!vids.length) return;
  var box=document.querySelector('.rb-crs'), cur=0, inView=false;
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function mark(){ vids.forEach(function(v,i){ v.parentNode.classList.toggle('is-on', i===cur); }); }
  function playCur(){ vids.forEach(function(v,i){ if(i!==cur){ v.pause(); } }); var v=vids[cur]; v.preload='auto'; var p=v.play(); if(p&&p.catch)p.catch(function(){}); mark(); }
  function go(i){ vids[cur].pause(); cur=(i+vids.length)%vids.length; vids[cur].currentTime=0; if(inView) playCur(); else mark(); }
  vids.forEach(function(v,i){
    v.addEventListener('ended',function(){ var wasSound=!v.muted; v.muted=true; setBtn(v,false); go(i+1); if(wasSound){ vids[cur].muted=false; setBtn(vids[cur],true); } });
    v.addEventListener('click',function(){ if(i!==cur){ go(i); } else if(v.paused){ playCur(); } else { v.pause(); } });
  });
  function setBtn(v,on){ var b=v.parentNode.querySelector('.rb-cr__snd'); b.setAttribute('aria-pressed',on?'true':'false'); b.textContent=on?'Sound on':'Sound off'; b.setAttribute('aria-label',on?'Turn sound off':'Turn sound on'); }
  if('IntersectionObserver' in window && !reduce){
    new IntersectionObserver(function(es){ es.forEach(function(e){ inView=e.isIntersecting; if(inView) playCur(); else vids.forEach(function(v){v.pause();}); }); },{threshold:.4}).observe(box);
  }
  mark();
  document.addEventListener('click',function(e){
    var b=e.target.closest&&e.target.closest('.rb-cr__snd'); if(!b) return;
    var v=b.parentNode.querySelector('video'), i=vids.indexOf(v), on=v.muted;
    vids.forEach(function(o){ if(o!==v){ o.muted=true; setBtn(o,false); } });
    if(i!==cur){ go(i); }
    v.muted=!on; setBtn(v,on); if(on && v.paused) playCur();
  });
})();
</script>

<script>
(function(){
  var a=document.querySelector('[data-rb-acc]'); if(!a) return;
  a.querySelectorAll('.rb-acc__btn').forEach(function(b){
    b.addEventListener('click',function(){
      var open=b.getAttribute('aria-expanded')==='true';
      b.setAttribute('aria-expanded',open?'false':'true');
      document.getElementById(b.getAttribute('aria-controls')).hidden=open;
    });
  });
})();
</script>
